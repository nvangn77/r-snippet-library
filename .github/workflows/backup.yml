name: Daily Supabase backup

# Exports the entire snippets table to data/snippets-backup.json and commits it,
# giving versioned, off-site backups in git history (independent of Supabase).
# Requires repo secrets SUPABASE_URL and SUPABASE_SERVICE_KEY (service_role key).
# Restore: import data/snippets-backup.json via the app, or re-insert with the API.

on:
  schedule:
    - cron: '17 3 * * *'   # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export snippets from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "Secrets not configured yet — skipping (this is fine until you set them)."
            exit 0
          fi
          mkdir -p data
          curl -sS --fail \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/snippets?select=*&order=created_at.asc" \
            | jq '.' > data/snippets-backup.json
          echo "Backed up $(jq 'length' data/snippets-backup.json) snippets."

      - name: Commit backup if it changed
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain data/snippets-backup.json 2>/dev/null)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/snippets-backup.json
            git commit -m "Backup: snippets $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "No changes to back up."
          fi
